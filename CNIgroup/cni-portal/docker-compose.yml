# Dev services (DECISIONS D-A7). App runs on the host bound to 127.0.0.1;
# these back it. Production networking/TLS is handled by the team later.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cni
      POSTGRES_USER: cni
      POSTGRES_PASSWORD: cni_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:

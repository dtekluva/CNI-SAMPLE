# Machine-readable Phase-1 backlog — CNI Group Governance Portal
# Human source of truth: BUILD_BACKLOG.md (keep in sync).
# Loop protocol: pick lowest-id task with all deps 'done' and status 'todo';
# implement; run `tests`; if green and not checkpoint -> done; if checkpoint -> needs-review (stop for human).
meta:
  phase: 1
  prepared: "2026-07-17"
  rule_cross_cutting:
    - "every mutation writes an append-only AuditEvent (T-A2)"
    - "every read is permission-scoped, default-deny (T-B3)"
    - "email carries links only, never content (P5)"
  loop:
    checkpoint_behavior: "stop-for-human"
    never_autonomous: ["real deploys", "real notifications", "live e-sign", "data deletion"]

